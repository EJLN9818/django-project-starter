# Tool configuration only. Dependencies live in requirements-dev.txt.
# (This repo is a local template, not a published package.)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
extend-exclude = "template/"
