# Copier configuration for the Django Project Starter template.
# Docs: https://copier.readthedocs.io/
_min_copier_version: "9.19.1"
_subdirectory: template
# Re-render the generated project when the template is updated via `copier update`.
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: The human-readable name of the project.
  placeholder: "My Awesome Project"
  validator: >-
    {% if not (project_name | trim) %}
    Project name cannot be empty.
    {% endif %}

project_slug:
  type: str
  help: >-
    The project slug. Used for Python packages, Docker service names and
    directory names. Must start with a letter and contain only lowercase
    letters, digits and hyphens.
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') | regex_replace('[^a-z0-9-]', '') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    Slug must start with a letter and contain only lowercase letters, digits and hyphens.
    {% endif %}

port:
  type: int
  help: The port the application will be exposed on.
  default: 8000
  validator: >-
    {% if not (1 <= port <= 65535) %}
    Port must be between 1 and 65535.
    {% endif %}

database:
  type: str
  help: Which database backend to use.
  choices:
    PostgreSQL: postgresql
    SQLite: sqlite
  default: postgresql

postgres_db:
  type: str
  help: PostgreSQL database name.
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ database == 'postgresql' }}"

postgres_user:
  type: str
  help: PostgreSQL username.
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ database == 'postgresql' }}"

django_version:
  type: str
  help: The Django version to pin.
  default: "5.2.18"
  validator: >-
    {% if not (django_version | regex_search('^[0-9]+[.][0-9]+([.][0-9]+)?$')) %}
    Django version must look like 5.2 or 5.2.18.
    {% endif %}

# Computed: the Python package name (slug with underscores, since hyphens are
# not valid in Python identifiers).
package_name:
  type: str
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

python_version:
  type: str
  help: The Python version used in the Docker image.
  default: "3.13"
  validator: >-
    {% if not (python_version | regex_search('^[0-9]+[.][0-9]+$')) %}
    Python version must look like 3.13.
    {% endif %}

include_precommit:
  type: bool
  help: Include pre-commit and Ruff configuration?
  default: true

init_git:
  type: bool
  help: Initialize a git repository with an initial commit?
  default: true

# Tasks run after the project is generated. `when` is false on `copier update`,
# so updating never creates a second initial commit.
_tasks:
  - command: >-
      "{{ _copier_python }}" -c "import os, stat; p = '.githooks/pre-push'; os.chmod(p, os.stat(p).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)"
    when: "{{ _copier_operation == 'copy' and include_precommit }}"

  # `copier update` does not initialize Git again, but the new hook still needs
  # the executable bit when the project is used on Linux/macOS.
  - command: >-
      "{{ _copier_python }}" -c "import os, stat; p = '.githooks/pre-push'; os.chmod(p, os.stat(p).st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)"
    when: "{{ _copier_operation == 'update' and include_precommit }}"

  - command: >-
      "{{ _copier_python }}" -c "import subprocess as s; s.run(['git', 'init', '-q', '-b', 'main']); s.run(['git', 'add', '-A'])"
    when: "{{ _copier_operation == 'copy' and init_git }}"

  - command: >-
      "{{ _copier_python }}" -c "import subprocess as s; s.run(['git', 'update-index', '--chmod=+x', '.githooks/pre-push'])"
    when: "{{ _copier_operation == 'copy' and init_git and include_precommit }}"

  - command: >-
      "{{ _copier_python }}" -c "import subprocess as s; s.run(['git', 'commit', '-q', '-m', 'Initial commit from django-project-starter'])"
    when: "{{ _copier_operation == 'copy' and init_git }}"

  - command: >-
      "{{ _copier_python }}" -c "import subprocess as s; s.run(['git', 'config', 'core.hooksPath', '.githooks'])"
    when: "{{ _copier_operation == 'copy' and init_git and include_precommit }}"

_message_after_copy: |
  Project "{{ project_name }}" created successfully!

  Next steps:
    cd "{{ _copier_conf.dst_path }}"
    Copy .env.example to .env, then set SECRET_KEY (and POSTGRES_PASSWORD for PostgreSQL).

  Start Docker-only development:
    docker compose -f docker-compose.yml -f compose.dev.yml up --build

  Create the first admin user (in another terminal):
    docker compose -f docker-compose.yml -f compose.dev.yml exec web python backend/manage.py createsuperuser

  Tests and lint:
    docker compose -f docker-compose.yml -f compose.dev.yml run --rm web pytest
    docker compose -f docker-compose.yml -f compose.dev.yml run --rm --no-deps --entrypoint ruff web check .

  {% if include_precommit %}
  Run pre-commit in Docker:
    docker compose -f docker-compose.yml -f compose.dev.yml run --rm --no-deps --entrypoint pre-commit web run --all-files

  The .githooks/pre-push hook is configured automatically when Git is initialized.
  {% endif %}
  {% if include_precommit and not init_git %}
  After running `git init`, enable the pre-push hook with:
    git config core.hooksPath .githooks
  {% endif %}

  Read README.md for the full Docker-only workflow.
  No local Python, virtualenv or Makefile is required for daily work.

  Happy hacking!
