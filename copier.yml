# Copier configuration for the Django Project Starter template.
# Docs: https://copier.readthedocs.io/
_min_copier_version: "9.19.1"
_subdirectory: template
# Re-render the generated project when the template is updated via `copier update`.
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: The human-readable name of the project.
  placeholder: "My Awesome Project"
  validator: >-
    {% if not (project_name | trim) %}
    Project name cannot be empty.
    {% endif %}

project_slug:
  type: str
  help: >-
    The project slug. Used for Python packages, Docker service names and
    directory names. Must start with a letter and contain only lowercase
    letters, digits and hyphens.
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') | regex_replace('[^a-z0-9-]', '') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]*$')) %}
    Slug must start with a letter and contain only lowercase letters, digits and hyphens.
    {% endif %}

port:
  type: int
  help: The port the application will be exposed on.
  default: 8000
  validator: >-
    {% if not (1 <= port <= 65535) %}
    Port must be between 1 and 65535.
    {% endif %}

database:
  type: str
  help: Which database backend to use.
  choices:
    PostgreSQL: postgresql
    SQLite: sqlite
  default: postgresql

postgres_db:
  type: str
  help: PostgreSQL database name.
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ database == 'postgresql' }}"

postgres_user:
  type: str
  help: PostgreSQL username.
  default: "{{ project_slug | replace('-', '_') }}"
  when: "{{ database == 'postgresql' }}"

django_version:
  type: str
  help: The Django version to pin.
  default: "5.2.18"
  validator: >-
    {% if not (django_version | regex_search('^[0-9]+[.][0-9]+([.][0-9]+)?$')) %}
    Django version must look like 5.2 or 5.2.18.
    {% endif %}

# Computed: the Python package name (slug with underscores, since hyphens are
# not valid in Python identifiers).
package_name:
  type: str
  default: "{{ project_slug | replace('-', '_') }}"
  when: false

python_version:
  type: str
  help: The Python version used in the Docker image.
  default: "3.13"
  validator: >-
    {% if not (python_version | regex_search('^[0-9]+[.][0-9]+$')) %}
    Python version must look like 3.13.
    {% endif %}

include_precommit:
  type: bool
  help: Include pre-commit, ruff and black configuration?
  default: true

init_git:
  type: bool
  help: Initialize a git repository with an initial commit?
  default: true

# Tasks run after the project is generated. `when` is false on `copier update`,
# so updating never creates a second initial commit.
_tasks:
  - command: >-
      "{{ _copier_python }}" -c "import subprocess as s;s.run(['git','init','-q','-b','main']);s.run(['git','add','-A']);s.run(['git','commit','-q','-m','Initial commit from django-project-starter'])"
    when: "{{ _copier_operation == 'copy' and init_git }}"

_message_after_copy: |
  Project "{{ project_name }}" created successfully!

  Next steps:
    cd "{{ _copier_conf.dst_path }}"
    Copy .env.example to .env, then set SECRET_KEY (and POSTGRES_PASSWORD for PostgreSQL).

  Docker-only development (recommended):
    docker compose -f docker-compose.yml -f compose.dev.yml up --build

  Production-like Docker run:
    docker compose up --build

  {% if include_precommit %}
  Optional local venv:
    python -m venv .venv && source .venv/bin/activate
    pip install -r requirements-dev.txt
    pre-commit install
  {% else %}
  Optional local venv:
    python -m venv .venv && source .venv/bin/activate
    pip install -r requirements-dev.txt
  {% endif %}

  Happy hacking!
